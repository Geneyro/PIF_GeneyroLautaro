name: DETAIL CONTROL

# Solo se ejecuta cuando cambian archivos de detail-control-system/ (o este
# mismo flujo). No interviene en el flujo del prototipo (ci.yml).
on:
  push:
    paths:
      - 'detail-control-system/**'
      - '.github/workflows/detail-control.yml'
  pull_request:
    paths:
      - 'detail-control-system/**'
      - '.github/workflows/detail-control.yml'

concurrency:
  group: detail-control-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: detail-control-system

jobs:
  verificar:
    name: Lint, tipos, pruebas y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: detail-control-system/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Chequeo de tipos
        run: npm run typecheck

      # Supabase local dentro del runner: aplica todas las migraciones y el seed.
      - name: Levantar Supabase local (migraciones + datos de prueba)
        run: npx supabase start

      # Claves del Supabase local del runner: son valores de desarrollo que
      # genera la CLI, no secretos del proyecto. No se usa ningún secreto de GitHub.
      - name: Exportar variables del Supabase local
        run: |
          npx supabase status -o env > "$RUNNER_TEMP/supabase.env"
          valor() { grep -E "^$1=" "$RUNNER_TEMP/supabase.env" | head -n 1 | cut -d= -f2- | tr -d '"'; }
          url="$(valor API_URL)"
          clave="$(valor ANON_KEY)"
          if [ -z "$clave" ]; then clave="$(valor PUBLISHABLE_KEY)"; fi
          if [ -z "$url" ] || [ -z "$clave" ]; then
            echo "No se pudieron leer API_URL / ANON_KEY de 'supabase status'." >&2
            sed -E 's/=.*/=<oculto>/' "$RUNNER_TEMP/supabase.env" >&2
            exit 1
          fi
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$url"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$clave"
            echo "PRUEBAS_SUPABASE_URL=$url"
            echo "PRUEBAS_SUPABASE_ANON_KEY=$clave"
          } >> "$GITHUB_ENV"

      - name: Pruebas de los criterios de aceptación
        run: npm test

      - name: Compilar la aplicación
        run: npm run build

      - name: Sin sesión, toda ruta redirige al inicio de sesión
        run: |
          npm run start > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:3100/login && break
            sleep 1
          done
          for ruta in / /catalogo /ingresos /fraccionar /movimientos; do
            resultado="$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "http://localhost:3100$ruta")"
            echo "$ruta -> $resultado"
            if [ "$resultado" != "307 http://localhost:3100/login" ]; then
              echo "La ruta $ruta no redirige al inicio de sesión." >&2
              cat "$RUNNER_TEMP/app.log" >&2
              exit 1
            fi
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3100/login)" = "200"
